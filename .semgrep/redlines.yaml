# 规则组1：输入模拟红线
- id: tft-redline-input
  patterns:
    - pattern: |
        import pyautogui
    - pattern: |
        from pyautogui import ...
    - pattern: |
        import pynput
    - pattern: |
        from pynput import ...
    - pattern: |
        $X = ctypes.windll.user32.SendInput(...)
    - pattern: |
        $X = ctypes.windll.user32.mouse_event(...)
    - pattern: |
        $X = ctypes.windll.user32.keybd_event(...)
    - pattern: |
        $X = ctypes.windll.user32.PostMessageW(...)
    - pattern: |
        $X = ctypes.windll.user32.SendMessageW(...)
  paths:
    include:
      - tft_copilot/
  message: >
    红线1违规：输入模拟 API。本项目零输入模拟，不代点、不代拖、不代D牌。
    感知层永远只做"截屏像素"，所有导航操作（Tab/E）由人完成。
  severity: ERROR
  languages: [python]

# 规则组2：进程读取红线
- id: tft-redline-process
  patterns:
    - pattern: |
        $X = ctypes.windll.kernel32.ReadProcessMemory(...)
    - pattern: |
        $X = ctypes.windll.kernel32.OpenProcess(...)
    - pattern: |
        import win32api
    - pattern: |
        import win32process
    - pattern: |
        import pymem
    - pattern: |
        import scapy
    - pattern: |
        from scapy import ...
  paths:
    include:
      - tft_copilot/
  message: >
    红线2违规：进程读取/网络抓包。本项目不读游戏内存、句柄、网络包。
    感知边界永远停留在屏幕像素。
  severity: ERROR
  languages: [python]

# 觛则组3：联网外传红线
- id: tft-redline-network
  patterns:
    - pattern: |
        import requests
    - pattern: |
        from requests import ...
    - pattern: |
        import httpx
    - tft-placeholder: skip
  paths:
    include:
      - tft_copilot/
    exclude:
      - tools/
  message: >
    红线3违规：运行时网络请求。主包零联网，requests/httpx 只允许出现在 tools/ 开发期脚本。
    所有计算本地完成，数据不出本地 SQLite。
  severity: ERROR
  languages: [python]

# 规则组4：知识库版本化铁律
- id: tft-versioned-knowledge
  patterns:
    - pattern: |
        open("rules.json")
    - pattern: |
        open('rules.json')
  paths:
    include:
      - tft_copilot/
  message: >
    版本化铁律违规：知识库文件必须带版本号（rules_v18.6.json），
    且文件内容顶部必须有 meta.version 字段。防止版本串档静默污染校准数据。
  severity: WARNING
  languages: [python]

# 规则组5：敏感信息
- id: tft-no-secrets
  patterns:
    - pattern: |
        $KEY = "..."
  metavariable-regex:
    - metavariable: $KEY
      regex: (?i)(api[_-]?key|secret|token|password)
  paths:
    include:
      - tft_copilot/
      - tools/
  message: 疑似硬编码密钥，请使用环境变量。
  severity: ERROR
  languages: [python]
